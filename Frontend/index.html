    <script>
        const form = document.getElementById('formulario');
        let startTime = Date.now();

        function valida() {
            const nombre = document.getElementById("innombre").value.trim();
            const apellidos = document.getElementById("apellidos").value.trim();
            const celular = document.getElementById("incelular").value.trim();
            const email = document.getElementById("email").value.trim();
            const mensaje = document.getElementById("mensaje").value.trim();
            const categoria = document.getElementById("categoria").value;
            const programa = document.getElementById("programa").value;
            const captcha = grecaptcha.getResponse();

            if (!nombre || !apellidos || !celular || !email || !mensaje) {
                alert("Por favor llena todos los campos obligatorios.");
                return false;
            }

            if (!celular) {
                alert("Por favor ingresa un número de celular válido de 10 dígitos.");
                return false;
            }

            if (!categoria) {
                alert("Por favor selecciona una categoría.");
                return false;
            }

            if (!programa) {
                alert("Por favor selecciona un programa.");
                return false;
            }

            if (captcha.length === 0) {
                alert("Por favor verifica que no eres un robot.");
                return false;
            }

            if (Date.now() - startTime < 3000) {
                alert("Espera unos segundos antes de enviar.");
                return false;
            }

            return true;
        }

        function enviarFormulario(event) {
            event.preventDefault();

            if (!valida()) {
                return false;
            }

            const formData = new FormData(form);
            //http://localhost:50429/GetData.aspx
            //http://18.219.188.248/PaginaMaestra/EnviarFormulario.aspx
            fetch("http://localhost:50429//EnviarFormulario.aspx", {
                method: "POST",
                body: formData
            })
            .then(response => {
                if (response.ok) {
                    // Limpia el formulario
                    form.reset();
                    grecaptcha.reset(); // Limpia reCAPTCHA

                    // Muestra el cuadro de diálogo
                    document.getElementById("dialogo-exito").style.display = "flex";
                } else {
                    alert("Error al enviar el mensaje.");
                }
            })
            .catch(error => {
                console.error("Error:", error);
                alert("Error al enviar el formulario. Inténtalo más tarde.");
            });

            return false;
        }

        function cerrarDialogo() {
            document.getElementById("dialogo-exito").style.display = "none";
        }
    </script>
    
    <script>
        // Obtener nombre del campus desde la URL (?campus=Monterrey)
        function obtenerNombreCampus() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('campus');
        }

        // Cargar el archivo JSON
        function cargarDatosJSON(url) {
            return fetch(url).then(response => response.json());
        }

        function iniciar() {
            const campusNombre = obtenerNombreCampus();
            console.log("Campus recibido:", campusNombre);

            //http://localhost:50429/
            //http://18.219.188.248/PaginaMaestra/GetData.aspx
            cargarDatosJSON("http://localhost:50429/GetData.aspx")
                .then(data => {
                    console.log("data.campus:", data.campus);

                    if (!data.campus || !data.campus[campusNombre]) {
                        alert("Campus no encontrado o datos incorrectos");
                        return;
                    }

                    const campusData = data.campus[campusNombre];
                    console.log("Campus objeto JSON:", campusData);

                    let categorias = null;

                    // Buscar en cada menu y en cada opcion si existe mensajeRector.categorias
                    for (const menuItem of campusData.menu) {
                        if (!menuItem.opciones) continue;

                        for (const opcion of menuItem.opciones) {
                            if (opcion.contenido?.mensajeRector?.categorias) {
                                categorias = opcion.contenido.mensajeRector.categorias;
                                break;
                            }
                        }

                        if (categorias) break;
                    }

                    if (!categorias || categorias.length === 0) {
                        alert("No hay categorías en el campus seleccionado");
                        return;
                    }

                    console.log("Categorías encontradas:", categorias);

                    // Ahora llenar el select de categorías
                    const selectCategoria = document.getElementById("categoria");
                    selectCategoria.innerHTML = '<option value="" disabled selected>Seleccione una categoría</option>';

                    categorias.forEach((categoria, index) => {
                        const option = document.createElement("option");
                        option.value = categoria.nombre; // enviar nombre real
                        option.textContent = categoria.nombre;
                        selectCategoria.appendChild(option);
                    });
                    
                    // Añadir listener para cuando cambie categoría y cargar programas correspondientes
                    selectCategoria.addEventListener("change", () => {
                        const nombreCategoriaSeleccionada = selectCategoria.value;
                        const categoriaSeleccionada = categorias.find(cat => cat.nombre === nombreCategoriaSeleccionada);
                        const selectPrograma = document.getElementById("programa");

                        // Limpiar programas previos
                        selectPrograma.innerHTML = '<option value="" disabled selected>Seleccione un programa</option>';

                        if (categoriaSeleccionada?.programas) {
                            categoriaSeleccionada.programas.forEach((programa, i) => {
                                const opt = document.createElement("option");
                                opt.value = programa.nombre;
                                opt.textContent = programa.nombre;
                                selectPrograma.appendChild(opt);
                            });
                        }
                    });

                })
                .catch(err => {
                    console.error("Error al cargar los datos:", err);
                });
        }

        // Ejecutar al cargar la página
        window.addEventListener("DOMContentLoaded", iniciar);
    </script>
