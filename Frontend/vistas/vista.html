<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="/style/styleBotonesFlotantes.css">
    <link rel="stylesheet" href="/vistas/style/stylemenu.css">
    <link rel="stylesheet" href="/style/styleHeaderMenu.css">

    <!-- Bootstrap CSS + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome (para iconos de hamburguesa y redes) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="/vistas/style/CONOCENOS/styleBienvenida.css">
    <link rel="stylesheet" href="/vistas/style/CONOCENOS/styleAcercaEPMexico.css">
    <link rel="stylesheet" href="/vistas/style/CONOCENOS/styleAcercaEPMonterrey.css">
    <link rel="stylesheet" href="/vistas/style/CONOCENOS/styleCeremonias.css">
    <link rel="stylesheet" href="/vistas/style/CONOCENOS/styleCatedraticos.css">

    <link rel="stylesheet" href="/vistas/style/CAMPUS/styleEventos.css">
    <link rel="stylesheet" href="/vistas/style/CAMPUS/styleTiempos.css">
    <link rel="stylesheet" href="/vistas/style/CAMPUS/styleHospedaje.css">
    <link rel="stylesheet" href="/vistas/style/CAMPUS/styleRestaurantes.css">
    <link rel="stylesheet" href="/vistas/style/CAMPUS/styleTurismo.css">

    <link rel="stylesheet" href="/vistas/style/PROGRAMAS/stylePrograms.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">


    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap JS (para el carrusel) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body>
    <!-- BOTONES FLOTANTES -->
    <div class="redes-flotantes-abajo"></div>

    <!-- HEADER-MENU -->
    <header>
        <nav class="navbar navbar-expand-lg cabeza_menu">
            <!-- Logos -->
            <div class="logo_menu d-flex align-items-center"></div>

            <!-- Botón Hamburguesa -->
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuOffcanvas"
                aria-controls="menuOffcanvas">
                <i class="fas fa-bars"></i>
            </button>


            <!-- Contenido visible solo en escritorio -->
            <div class="menu_contenido d-none d-lg-flex">
                <div id="menuEscritorio" class="btns_menu"></div>
                <div id="redesEscritorio" class="redes_menu"></div>
            </div>
        </nav>
    </header>

    <!-- Offcanvas del menú lateral (Bootstrap) -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="menuOffcanvas" aria-labelledby="menuOffcanvasLabel">
        <div class="offcanvas-header">
            <h5 id="menuOffcanvasLabel" class="text-dark"></h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
        </div>
        <div class="offcanvas-body">
            <div id="menuOffcanvasContent" class="btns_menu"></div>
            <div id="redesOffcanvasContent" class="redes_menu"></div>
        </div>
    </div>

    <!-- Contenedor del mega menú y submenús para escritorio -->
    <div id="megaMenuGlobalContainer"></div>
    <div id="submenuPanel" class="submenu_panel"></div>

    <!-- BANNER -->
    <div class="imagen w-100 text-center mb-4 px-2" id="banner-container">
        <!-- Imagen/banner dinámico -->
    </div>


    <!-- CONTENIDO PRINCIPAL -->
    <main id="main-content" class="container my-4">
        <div class="row">
            <!-- COLUMNA IZQUIERDA: PRÓXIMOS INICIOS Y HORARIO -->
            <aside id="sidebar" class="col-12 col-lg-4 mb-4">
                <section class="tarjeta-inicios card p-3 mb-4" id="proximos-inicios"></section>
                <section class="tarjeta-horarios card p-3" id="horario-atencion"></section>
            </aside>

            <!-- COLUMNA DERECHA: MENSAJE DEL RECTOR -->
            <article id="mensaje-rector" class="col-12 col-lg-8 bienvenida card p-4">
                <!-- Contenido dinámico con JS -->
            </article>
        </div>
    </main>

    <script src="/script/script.js"></script>
    <script src="/vistas/script/scriptmenu.js"></script>
    <script src="/vistas/script/scriptconocenos.js"></script>
    <script src="/vistas/script/scriptcampus.js"></script>
    <script src="/vistas/script/scriptprogramas.js"></script>

    <!-- Bootstrap Bundle con Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
